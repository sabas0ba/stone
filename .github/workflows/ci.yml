# リグレッションテスト (tools/test.sh) を GitHub Actions で実行する。
# 使用する action は commit SHA で固定する。
name: ci

on:
  push:
    branches: [main]
  # draft の間は走らせない (下の if)。ready にした時点で 1 度だけ走るよう
  # ready_for_review を種類に足す
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # 週次はキャッシュを使わずゼロから全段を再ビルドし，.md 記載の SHA-256 の
  # 再現性そのものを検証する (docs/dev-notes.md 1.3)
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# 同じ PR へ続けて push したとき，走行中の古い run を新しい run が取り消す。
# main への push と週次 (schedule) は検証そのものなので取り消さない
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    # draft の PR では走らせない。作業中の push でキャッシュと計算時間を
    # 使い切らないための措置で，見せるための draft は draft のまま置ける
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    # 鎖は世代を足すたびに長くなる。キャッシュが完全に外れた回
    # (新しい Stage の手順を足した直後など) はゼロから全段を作るので，
    # その回だけ突出して長い。第 6 部で cc15o / ld16 を足したときに
    # 60 分でも足りなくなった (60 分でジョブが cancelled)。
    #
    # cancelled ではキャッシュが保存されないので，上限が足りないと
    # 「毎回コールドビルド -> 毎回 cancelled」から抜けられない。上限は
    # 温まった回の実測 (15 分前後) ではなく，**コールドビルドが収まる
    # 値**にしておく必要がある。
    #
    # 温まった回を短くするほうの手当ては tools/build/stage015{a,b,c}.sh の
    # 分割である (docs/dev-notes.md 1.4)。封じた世代 (stage015a) は
    # 原文が変わらないので，一度キャッシュに入れば以後は必ず飛ばせる
    timeout-minutes: 120
    env:
      STONE_ENGINE: podman
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # コンテナ像は env/Containerfile だけで決まる (base image は digest 固定，
      # パッケージ取得先は snapshot.debian.org の日付固定)。したがって
      # そのハッシュを鍵にすれば，像をそのまま持ち回してよい。
      # 復元できれば tools/env.sh build がビルドを省くので，毎回の apt-get が
      # 丸ごと消える。復元できなければ従来どおりビルドして次回のために保存する。
      #
      # 鍵には実行系 (podman / OCI ランタイム) の版も含める。runner の更新で
      # 実行系が変わると，古い版で保存した tar の像が
      # "crun: unknown version specified" で実行できなくなることがある
      # (docs/dev-notes.md 4 章)。版が変われば鍵が変わり，像を作り直す
      - name: Container runtime version (for cache key)
        id: rt
        run: |
          ver=$( { podman --version; podman info --format '{{.Host.OCIRuntime.Version}}' 2>/dev/null | head -n 1; } | tr -cd 'A-Za-z0-9._-' )
          echo "ver=$ver" >> "$GITHUB_OUTPUT"

      - name: Restore container image
        id: image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/stone-env.tar
          key: stone-env-${{ steps.rt.outputs.ver }}-${{ hashFiles('env/Containerfile') }}

      - name: Load container image
        if: steps.image.outputs.cache-hit == 'true'
        run: podman load -i tmp/stone-env.tar

      # 生成物キャッシュ。ビルドは決定的なので，入力が一致すれば生成物を
      # 持ち回してよい (docs/dev-notes.md 1.3)。鍵が完全一致しなくても
      # restore-keys で直近のものを復元し，tools/build.sh のスタンプが
      # 変更のあった Stage だけを作り直す。生成物と .md の SHA-256 照合は
      # 毎回全 Stage で行われる。schedule ではキャッシュを使わない
      - name: Restore build artifacts
        if: github.event_name != 'schedule'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/build
          key: stone-build-${{ hashFiles('stage*/**', 'include/**', 'lib/**', 'tools/**') }}
          restore-keys: |
            stone-build-

      - name: Run regression tests
        env:
          STONE_FORCE_BUILD: ${{ github.event_name == 'schedule' && '1' || '' }}
        run: bash tools/test.sh

      # 保存は取り出せなかったときだけ。actions/cache の post 段が
      # tmp/stone-env.tar を拾って次回へ持ち越す
      - name: Save container image
        if: steps.image.outputs.cache-hit != 'true'
        run: |
          mkdir -p tmp
          podman save -o tmp/stone-env.tar stone-env
